<!DOCTYPE html>
<html><head><title>Hash Collision Calculator</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel=stylesheet href="../css/style.css" type="text/css">
<style type="text/css">
.buttons
{
  width: 9em;
}
body
{
  max-width: initial;
}
.num-chars, .possible-chars {
  width: 5em;
  text-align: center;
}

</style>

</head>

<body class="reading" onLoad="calcCollisionChance(); calcCollisionChanceTable()">
<h3>Single Example</h3>
<form name="simpleCollisions">
<table><tr><td class="labels">&nbsp;</td><td>&nbsp;</td></tr>
<!-- TODO: Better names, characters? char set? objects? -->
<!-- TODO: Buttons for common char sets (hex, lower, lower+upper, base64, etc) -->
<tr><td class="labels">Possible Characters: </td><td><input type="number" name="possible_chars" style="width:100%" value="16" onchange="calcCollisionChance()"></td></tr>
<tr><td class="labels">Number of Characters: </td><td><input type="number" name="num_chars" style="width:100%" value="8" onchange="calcCollisionChance()"></td></tr>
<tr><td class="labels">Number of Hashes: </td><td><input type="number" name="num_hashes" style="width:100%" value="1000" onchange="calcCollisionChance()"></td></tr>
<!-- TODO: Buttons for common number of hashes (1000, 1M, 1B, etc), maybe drop down for multiplier instead? -->
<tr><td>&nbsp;</td></tr>

<tr><td class="labels">Chance of no collisions: </td><td><input type="number" name="probability_different" style="width:100%" value="" onchange="calcCollisionChance()"></td></tr>
<tr><td class="labels">Chance of collision 1 in x: </td><td><input type="number" name="one_in_chance_collision" style="width:100%" value="" onchange="calcCollisionChance()"></td></tr>
</table>

</form></div>

&nbsp;

<h3>Table of Examples</h3>
<div class="options" style="margin: 15px 0; display: flex; gap: 20px; flex-wrap: wrap;">
  <div>
    <label>Show: 
      <select id="collisionType" onchange="calcCollisionChanceTable()">
        <option value="collision">Chance of collision</option>
        <option value="no_collision" selected>Chance of no collision</option>
      </select>
    </label>
  </div>
  <div>
    <label>Format: 
      <select id="probabilityFormat" onchange="calcCollisionChanceTable()">
        <option value="decimal">Decimal (0 to 1)</option>
        <option value="percentage">Percentage</option>
        <option value="odds">1 in x odds</option>
      </select>
    </label>
  </div>
</div>


<table id="collisionTable">
  <thead>
    <tr>
      <th>&nbsp;</th>
      <th>&nbsp;</th>
      <th>Scenario 1</th>
      <th>Scenario 2</th>
      <th>Scenario 3</th>
      <th>Scenario 4</th>
    </tr>
    <tr>
      <th>Possible Chars</th>
      <th>Num Chars</th>
      <th><input type="text" title="Number of items generated in scenario 1" class="col-header" data-col="0" value="1,000"></th>
      <th><input type="text" title="Number of items generated in scenario 2" class="col-header" data-col="1" value="1,000,000"></th>
      <th><input type="text" title="Number of items generated in scenario 3" class="col-header" data-col="2" value="1,000,000,000"></th>
      <th><input type="text" title="Number of items generated in scenario 4" class="col-header" data-col="3" value="1,000,000,000,000"></th>
    </tr>
  </thead>
  <tbody>
    <tr data-row="0">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="2"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
    <tr data-row="1">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="16"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
    <tr data-row="2">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="26"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
    <tr data-row="3">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="36"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
    <tr data-row="4">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="62"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
    <tr data-row="5">
      <td><input type="number" title="How many possible characters there are to choose from?" class="possible-chars" value="64"></td>
      <td><input type="number" title="How many characters long will our string be?" class="num-chars" value="8"></td>
      <td><input type="text" class="result" data-col="0"></td>
      <td><input type="text" class="result" data-col="1"></td>
      <td><input type="text" class="result" data-col="2"></td>
      <td><input type="text" class="result" data-col="3"></td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td>Set all num chars:</td>
      <td><input type="number" id="setAllNumChars" class="num-chars" value="8" onchange="setAllNumChars()"></td>
  </tfoot>
</table>

<hr>
<p>Calculate collisions between cryptographic hashes</p>
</body>

function calcTotalPossible(alphabet_size, char_count) {
  return alphabet_size**char_count;
}

function collisionChance(num_generated, total_possible) {
  return 1 / Math.exp(num_generated**2 / (2 * total_possible));
}

function stripCommas(number) {
  return parseFloat(number.replace(/,/g, ''));
}

function toPct(chance) {

  return 1 / chance;

</script>



</html>
